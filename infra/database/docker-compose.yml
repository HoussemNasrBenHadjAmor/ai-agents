services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-agents-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: ${AGENT_DB_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:55433:5432"

    volumes:
      - ai-agents-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agent_admin -d agent_lab"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai-agents-postgres-data:
